# Infra des exercices :  docker compose up -d
#  - PostgreSQL : niveaux 6 (SQL) et 7 (SQLAlchemy)      -> localhost:5440
#  - S3 (SeaweedFS) : niveaux 10 (pandas/parquet) et 12 (Spark) -> http://localhost:9010
services:
  postgres:
    image: postgres:17-alpine
    container_name: exos_postgres
    environment:
      POSTGRES_USER: exo
      POSTGRES_PASSWORD: exo
      POSTGRES_DB: exercices
    ports:
      - "5440:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U exo -d exercices"]
      interval: 3s
      retries: 20

  s3:
    # S3 compatible (SeaweedFS). Identifiants : exo / exo123456 (voir infra/s3.json)
    image: chrislusf/seaweedfs:latest
    container_name: exos_s3
    command: server -s3 -s3.port=8333 -s3.config=/etc/seaweedfs/s3.json -dir=/data -volume.max=200 -master.volumeSizeLimitMB=128
    ports:
      - "9010:8333"
    volumes:
      - s3_data:/data
      - ./infra/s3.json:/etc/seaweedfs/s3.json:ro

volumes:
  pg_data:
  s3_data:
